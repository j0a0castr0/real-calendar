name: CI/CD Symfony API → ECS + CloudFormation

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        env:
            AWS_REGION: ${{ secrets.AWS_REGION }}
            STACK_NAME: ${{ secrets.STACK_NAME }}
            ECR_REPO: 584711701186.dkr.ecr.eu-west-1.amazonaws.com/real-calendar-api
            IMAGE_TAG: ${{ github.sha }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Build Docker image
              run: |
                  docker build --no-cache -t real-calendar-api:${IMAGE_TAG} .
                  docker tag real-calendar-api:${IMAGE_TAG} $ECR_REPO:${IMAGE_TAG}

            - name: Log in to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v1

            - name: Push Docker image to ECR
              run: docker push $ECR_REPO:${IMAGE_TAG}

            - name: Deploy CloudFormation stack
              run: |
                aws cloudformation deploy \
                --template-file aws/cloudformation.yaml \
                --stack-name "$STACK_NAME" \
                --capabilities CAPABILITY_NAMED_IAM \
                --parameter-overrides \
                ImageTag="$IMAGE_TAG" \
                DBPassword="${{ secrets.DB_PASSWORD }}"
