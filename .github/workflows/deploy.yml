name: CI/CD Symfony API → ECS + CloudFormation

on:
    push:
        branches:
            - main
        paths-ignore:
            - aws/cloudformation-auth.yaml

jobs:
    deploy-app:
        if: false
        runs-on: ubuntu-latest
        environment: production

        env:
            AWS_REGION: ${{ secrets.AWS_REGION }}
            STACK_NAME: ${{ secrets.STACK_NAME }}
            ECR_REPO: 584711701186.dkr.ecr.eu-west-1.amazonaws.com/real-calendar-api
            IMAGE_TAG: ${{ github.sha }}

        steps:
            - uses: actions/checkout@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Build Docker image
              run: |
                  docker build --no-cache -t real-calendar-api:${IMAGE_TAG} .
                  docker tag real-calendar-api:${IMAGE_TAG} $ECR_REPO:${IMAGE_TAG}

            - name: Log in to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v1

            - name: Push Docker image to ECR
              run: docker push $ECR_REPO:${IMAGE_TAG}

            - name: Deploy App CloudFormation stack
              run: |
                  aws cloudformation deploy \
                    --template-file aws/cloudformation-app.yaml \
                    --stack-name "$STACK_NAME-app" \
                    --capabilities CAPABILITY_NAMED_IAM \
                    --parameter-overrides \
                    ImageTag="$IMAGE_TAG" \
                    DBPassword="${{ secrets.DB_PASSWORD }}"

    deploy-auth:
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[auth]')
        runs-on: ubuntu-latest
        environment: production

        steps:
            - uses: actions/checkout@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Deploy Auth CloudFormation stack
              run: |
                  aws cloudformation deploy \
                    --template-file aws/cloudformation-auth.yaml \
                    --stack-name "$STACK_NAME-auth" \
                    --capabilities CAPABILITY_NAMED_IAM
