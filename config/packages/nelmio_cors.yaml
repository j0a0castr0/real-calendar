# config/packages/nelmio_cors.yaml
nelmio_cors:
    defaults:
        allow_origin: []
        allow_methods: []
        allow_headers: []
        expose_headers: []
        max_age: 3600
    paths:
        '^/':
            allow_origin:
                - 'http://real-calendar-frontend.s3-website-eu-west-1.amazonaws.com'
                - 'http://www.gatolizo.click'
            allow_methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
            allow_headers:
                - Content-Type
                - Authorization
                - X-Requested-With
                - X-ID-Token
            allow_credentials: true
