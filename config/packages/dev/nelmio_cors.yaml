# config/packages/dev/nelmio_cors.yaml
nelmio_cors:
    defaults:
        allow_credentials: true
        max_age: 3600
    paths:
        '^/':
            allow_origin:
                - 'http://localhost:8080'
                - 'http://127.0.0.1:8080'
                - 'http://localhost:3000'
            allow_headers:
                - Content-Type
                - Authorization
                - X-ID-Token
            allow_methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
