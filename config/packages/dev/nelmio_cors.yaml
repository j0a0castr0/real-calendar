nelmio_cors:
    defaults:
        allow_origin: ['http://localhost:8080', 'http://127.0.0.1:8080', 'http://localhost:3000'] # your React dev server
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization', 'X-ID-Token']
        max_age: 3600
    paths:
        '^/': ~
