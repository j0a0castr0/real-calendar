services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\AuthContext\Validator\CognitoJWTValidator:
        class: App\Shared\Validator\InMemory\InMemoryJWTValidator
        public: true

    App\Shared\Validator\JWTValidatorInterface:
        alias: App\AuthContext\Validator\CognitoJWTValidator

    # Optional: AuthController dummy arguments
    App\AuthContext\Controller\AuthController:
        arguments:
            $region: 'dummy'
            $userPoolId: 'dummy'
            $clientId: 'dummy'
